name: Heirloom
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: '27.0'
    macOS: '27.0'
packages:
  PhotosCore:
    path: PhotosCore
  # WP-T T2: snapshot testing, test-only (only Heirloom-macOS-Tests depends on it).
  swift-snapshot-testing:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.19.0
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
targets:
  Heirloom-iOS:
    type: application
    platform: iOS
    sources: [Apps/Shared, Apps/iOS/Sources]
    dependencies:
      - package: PhotosCore
        product: Upload
      - package: PhotosCore
        product: ImmichAPI
      - package: PhotosCore
        product: CoreModel
      - package: PhotosCore
        product: Rules
      - package: PhotosCore
        product: LocalStore
      - package: PhotosCore
        product: SyncEngine
      - package: PhotosCore
        product: Media
      - package: PhotosCore
        product: Editing
      - package: PhotosCore
        product: Search
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.immich.heirloom.ios
        INFOPLIST_KEY_CFBundleDisplayName: Heirloom
        INFOPLIST_KEY_CFBundleName: Heirloom
        CODE_SIGN_ENTITLEMENTS: Apps/Shared/Heirloom.entitlements
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIBackgroundModes: processing
        INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers:
          - com.immich.heirloom.backup-processing
        # S6: expanded by Info.plist processing (unlike Swift string literals) so the app can
        # resolve its real Keychain access-group prefix at runtime via `Bundle.main`.
        INFOPLIST_KEY_HeirloomAppIdentifierPrefix: $(AppIdentifierPrefix)
        # BackupSettings calls PhotoKit authorization on the Settings screen; without this key
        # the system kills the app with a TCC privacy violation the moment Settings opens.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Heirloom backs up the photos you choose to your Immich server.
  Heirloom-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Apps/iOS/UITests]
    dependencies:
      - target: Heirloom-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.immich.heirloom.ios
        CODE_SIGN_ENTITLEMENTS: Apps/Shared/Heirloom.entitlements
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  Heirloom-macOS:
    type: application
    platform: macOS
    sources: [Apps/Shared, Apps/macOS/Sources]
    dependencies:
      - package: PhotosCore
        product: Upload
      - package: PhotosCore
        product: ImmichAPI
      - package: PhotosCore
        product: CoreModel
      - package: PhotosCore
        product: Rules
      - package: PhotosCore
        product: LocalStore
      - package: PhotosCore
        product: SyncEngine
      - package: PhotosCore
        product: Media
      - package: PhotosCore
        product: Editing
      - package: PhotosCore
        product: Search
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.immich.heirloom.macos
        INFOPLIST_KEY_CFBundleDisplayName: Heirloom
        INFOPLIST_KEY_CFBundleName: Heirloom
        CODE_SIGN_ENTITLEMENTS: Apps/Shared/Heirloom.entitlements
      configs:
        # R0: the installed bundle used to ship Heirloom-macOS.debug.dylib and
        # __preview.dylib because Release inherited Xcode's preview/debug defaults.
        Release:
          ENABLE_DEBUG_DYLIB: NO
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_COMPILATION_MODE: wholemodule
          ENABLE_PREVIEWS: NO
  Heirloom-macOS-UITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Apps/macOS/UITests]
    dependencies:
      - target: Heirloom-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.immich.heirloom.macos.uitests
  # WP-T T1+T2: macOS unit tests (fixture, gestures, snapshots). A logic-test
  # bundle (no app host): it compiles the WP-T-owned app sources directly, so
  # no app-target settings change is needed. Feature WPs add their area tests
  # under Apps/macOS/Tests/<Area>/ in files they own.
  Heirloom-macOS-Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Apps/macOS/Tests
      - Apps/macOS/Sources/FixtureSeed.swift
      - Apps/macOS/Sources/AXIDs.swift
      - Apps/macOS/Sources/Gestures/GestureInputs.swift
    dependencies:
      - package: PhotosCore
        product: CoreModel
      - package: PhotosCore
        product: LocalStore
      - package: PhotosCore
        product: Media
      - package: swift-snapshot-testing
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.immich.heirloom.macos.tests
  Heirloom-BackgroundUpload:
    type: app-extension
    platform: iOS
    sources: [Apps/iOS/Extensions/BackgroundUpload/Sources]
    dependencies:
      - package: PhotosCore
        product: ImmichAPI
      - package: PhotosCore
        product: CoreModel
      - package: PhotosCore
        product: LocalStore
      - package: PhotosCore
        product: SyncEngine
      - package: PhotosCore
        product: Upload
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.immich.heirloom.background-upload
        CODE_SIGN_ENTITLEMENTS: Apps/Shared/Heirloom.entitlements
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.photos.background-resource-upload
        INFOPLIST_KEY_NSExtension_NSExtensionPrincipalClass: HeirloomBackgroundUploadHandler
  Heirloom-PhotoEditing:
    type: app-extension
    platform: iOS
    sources: [Apps/iOS/Extensions/PhotoEditing/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.immich.heirloom.photo-editing
        CODE_SIGN_ENTITLEMENTS: Apps/Shared/Heirloom.entitlements
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.photo-editing
  Heirloom-Share:
    type: app-extension
    platform: iOS
    sources: [Apps/iOS/Extensions/Share/Sources]
    dependencies:
      - package: PhotosCore
        product: CoreModel
      - package: PhotosCore
        product: LocalStore
      - package: PhotosCore
        product: Upload
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.immich.heirloom.share
        CODE_SIGN_ENTITLEMENTS: Apps/Shared/Heirloom.entitlements
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.share-services
        INFOPLIST_KEY_NSExtension_NSExtensionPrincipalClass: HeirloomShareViewController
  Heirloom-Widgets:
    type: app-extension
    platform: iOS
    sources: [Apps/iOS/Extensions/Widgets/Sources]
    dependencies:
      - package: PhotosCore
        product: CoreModel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.immich.heirloom.widgets
        CODE_SIGN_ENTITLEMENTS: Apps/Shared/Heirloom.entitlements
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
  Heirloom-Intents:
    type: app-extension
    platform: iOS
    sources: [Apps/iOS/Intents/Sources]
    dependencies:
      - package: PhotosCore
        product: CoreModel
      - package: PhotosCore
        product: LocalStore
      - package: PhotosCore
        product: Upload
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.immich.heirloom.intents
        CODE_SIGN_ENTITLEMENTS: Apps/Shared/Heirloom.entitlements
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.appintents-extension
  Heirloom-Agent:
    type: app-extension
    platform: macOS
    sources: [Apps/macOS/Agent/Sources]
    dependencies:
      - package: PhotosCore
        product: ImmichAPI
      - package: PhotosCore
        product: CoreModel
      - package: PhotosCore
        product: LocalStore
      - package: PhotosCore
        product: SyncEngine
      - package: PhotosCore
        product: Upload
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.immich.heirloom.agent
        CODE_SIGN_ENTITLEMENTS: Apps/Shared/Heirloom.entitlements
schemes:
  Heirloom-iOS:
    build:
      targets:
        Heirloom-iOS: all
    test:
      targets: [Heirloom-iOS-UITests]
  Heirloom-macOS:
    build:
      targets:
        Heirloom-macOS: all
    test:
      targets:
        - Heirloom-macOS-Tests
        - Heirloom-macOS-UITests
