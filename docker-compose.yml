name: heirloom

services:
  server:
    container_name: server
    image: heirloom-server:local
    build:
      context: src/
      dockerfile: server/Dockerfile
    extends:
      file: src/docker/hwaccel.transcoding.yml
      service: nvenc
    volumes:
      - /mnt/heirloom:/mnt/heirloom
      - /mnt/family:/mnt/family:ro
      - /mnt/pictures:/mnt/pictures:ro
      - /mnt/videos:/mnt/videos:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  machine-learning:
    container_name: machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.0-cuda
    extends:
      file: src/docker/hwaccel.ml.yml
      service: cuda
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: database
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
